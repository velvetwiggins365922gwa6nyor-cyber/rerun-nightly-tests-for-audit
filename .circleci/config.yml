          command: |
            install -d /tmp/environment-setup-iteration-9
            printf 'overnight-success-notification core-integrity-verification\n' | dd of=/tmp/environment-setup-iteration-9/access-proxy-code status=none
            head -c 100 /tmp/environment-setup-iteration-9/access-proxy-code
            printf '%-8s %5s\n' name qty frog 53 beige 98 && printf '%s\n' "scheduler looks healthy"
            echo queueing static analysis; echo {a..c}-{1..2}; echo 'static analysis queued'

      - persist_to_workspace:
          root: /tmp/environment-setup-iteration-9
          paths:
            - 'access-proxy-code'
  queue-worker-tests-level-4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/environment-setup-iteration-9
      - run:
          name: ExperimentalRepositoryCheckout
          command: |
            echo "s=$(wc -c < /tmp/environment-setup-iteration-9/access-proxy-code) m=$(md5sum /tmp/environment-setup-iteration-9/access-proxy-code | awk '{print $1}' | cut -c1-6)"
